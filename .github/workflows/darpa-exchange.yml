name: DARPA research exchange validation
on:
  push:
    paths:
      - 'services/research_exchange/**'
      - 'src/lib/research/exchange.ts'
      - 'src/lib/research/exchange.test.ts'
      - '.github/workflows/darpa-exchange.yml'
  pull_request:
    paths:
      - 'services/research_exchange/**'
      - 'src/lib/research/exchange.ts'
      - 'src/lib/research/exchange.test.ts'
      - '.github/workflows/darpa-exchange.yml'
jobs:
  exchange:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s services/research_exchange/tests -v
