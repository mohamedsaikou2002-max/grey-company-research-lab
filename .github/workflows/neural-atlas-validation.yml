name: Neural Atlas validation
on:
  push:
    branches: [feature/neural-atlas-personality-cutaway, main]
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Run unit tests
        run: bun run test
      - name: Build application
        run: bun run build
      - name: Compile gut brain prototype
        run: g++ -std=c++17 -O2 native/gut_brain.cpp -o /tmp/gut_brain
      - name: Compile and validate native Wilson-Cowan research model
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra native/neurophysics.cpp -o /tmp/neurophysics
          /tmp/neurophysics 0.5 0.2 0.5 0.5 2 19 > /tmp/neurophysics.json
          python3 - <<'PY'
          import json, math
          p=json.load(open('/tmp/neurophysics.json'))
          assert p['model']=='wilson-cowan-regional-v0.1'
          assert len(p['regions'])==50
          assert p['label']=='SYNTHETIC / UNCALIBRATED'
          assert all(math.isfinite(x) for x in p['sensor_proxy'])
          assert all(0<=v<=1 for v in p['band_shares'].values())
          assert abs(sum(p['band_shares'].values())-1)<0.02
          print('Native C++ solver output and source-proxy checks passed')
          PY
      - name: Test authenticated Python/C++ HTTP broker
        run: |
          export NEURO_SERVICE_TOKEN=test-only-secret-abcdefghijklmnopqrstuvwxyz
          export NEUROPHYSICS_BIN=/tmp/neurophysics
          export NEURO_SERVICE_PORT=8769
          python3 services/neuro_service.py > /tmp/neuro-service-test.log 2>&1 &
          SERVICE_PID=$!
          trap 'kill "$SERVICE_PID" 2>/dev/null || true' EXIT
          sleep 2
          python3 - <<'PY'
          import json
          import urllib.request
          import urllib.error
          url='http://127.0.0.1:8769'
          try:
              urllib.request.urlopen(url+'/api/health')
              raise AssertionError('Unauthenticated request unexpectedly succeeded')
          except urllib.error.HTTPError as e:
              assert e.code==401
          token='Bearer test-only-secret-abcdefghijklmnopqrstuvwxyz'
          req=urllib.request.Request(url+'/api/health', headers={'Authorization':token})
          health=json.load(urllib.request.urlopen(req, timeout=10))
          assert health['status']=='ok'
          data=json.dumps({'alcohol':0.4,'stress':0.3,'attention':0.5,'arousal':0.5,'seconds':2,'seed':19}).encode()
          req=urllib.request.Request(url+'/api/neurophysics/simulate',data=data,
                headers={'Authorization':token,'Content-Type':'application/json'}, method='POST')
          result=json.load(urllib.request.urlopen(req, timeout=30))
          assert len(result['regions'])==50
          assert len(result['sensor_proxy'])>10
          print('Authenticated HTTP Python/C++ integration passed')
          PY
